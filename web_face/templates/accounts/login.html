{% extends "base.html" %}
{% load static %}

{% block title %}تسجيل الدخول — Systemize{% endblock %}

{% block content %}
<div style="max-width: 380px; margin: 60px auto;">
  <div class="card" style="border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px 28px; background: var(--bg-surface); box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 20px;">
      {% if gym_profile.logo %}
        <img src="{{ gym_profile.logo.url }}" alt="Logo" style="width: 52px; height: 52px; border-radius: var(--radius-sm); object-fit: contain; margin: 0 auto 10px auto; display: block;">
      {% else %}
        <img src="{% static 'images/logo.png' %}" alt="Logo" style="width: 52px; height: 52px; border-radius: var(--radius-sm); object-fit: contain; margin: 0 auto 10px auto; display: block;" onerror="this.style.display='none'">
      {% endif %}
      <h2 style="color: var(--text-main); font-size: 1.15rem; font-weight: 700; margin: 0;">تسجيل الدخول</h2>
      <p style="color: var(--text-muted); font-size: 0.78rem; margin: 4px 0 0 0;">ادخل بيانات الاعتماد للمتابعة</p>
    </div>

    <form method="post" action="{% url 'accounts:login' %}">
      {% csrf_token %}
      
      <div class="form-group" style="margin-bottom: 12px;">
        <label class="form-label" for="username" style="font-size: 0.78rem; font-weight: 600; margin-bottom: 4px; display: block;">اسم المستخدم</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="اسم المستخدم" required autofocus style="height: 34px; font-size: 0.84rem;">
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" for="password" style="font-size: 0.78rem; font-weight: 600; margin-bottom: 4px; display: block;">كلمة المرور</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required style="height: 34px; font-size: 0.84rem;">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; height: 34px; font-size: 0.86rem; font-weight: 700; justify-content: center;">
        تسجيل الدخول
      </button>
    </form>
  </div>
</div>
{% endblock %}
