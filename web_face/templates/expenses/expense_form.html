{% extends "base.html" %}

{% block title %}تسجيل مصروف جديد — {{ gym_profile.gym_name|default:"Systemize Gym" }}{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 30px auto;">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">💸 تسجيل مصروف جديد</h2>
    </div>

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label">تصنيف المصروف *</label>
        <select name="category_id" class="form-control" required>
          <option value="">-- اختر التصنيف --</option>
          {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">المبلغ (ج.م) *</label>
        <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" min="0.01" required autofocus style="font-size: 1.2rem; font-weight: 700; color: var(--danger);">
      </div>

      <div class="form-group">
        <label class="form-label">تاريخ المصروف</label>
        <input type="date" name="expense_date" class="form-control" value="{{ today|date:'Y-m-d' }}" required>
      </div>

      <div class="form-group">
        <label class="form-label">الوصف والتفاصيل</label>
        <textarea name="description" class="form-control" rows="3" placeholder="تفاصيل الفاتورة، اسم المستلم، أو رقم الإيصال..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; font-size: 1.1rem; padding: 12px;">
        تسجيل المصروف 💾
      </button>
    </form>
  </div>
</div>
{% endblock %}
