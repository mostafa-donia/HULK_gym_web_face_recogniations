{% extends "base.html" %}

{% block title %}تسجيل مكافأة أو خصم — {{ gym_profile.gym_name|default:"Systemize Gym" }}{% endblock %}

{% block content %}
<div style="max-width: 540px; margin: 30px auto;">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">⚖️ تسجيل مكافأة أو خصم لموظف</h2>
    </div>

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label">الموظف / المدرب *</label>
        <select name="employee_id" class="form-control" required>
          <option value="">-- اختر الموظف --</option>
          {% for emp in employees %}
            <option value="{{ emp.id }}">{{ emp.name }} ({{ emp.get_role_display }})</option>
          {% endfor %}
        </select>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">نوع البند *</label>
          <select name="adjustment_type" class="form-control" required>
            <option value="BONUS">حافز / مكافأة (+)</option>
            <option value="DEDUCTION">خصم / جزاء (-)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">الشهر المستهدف (YYYY-MM)</label>
          <input type="month" name="period" class="form-control" value="{{ current_period }}" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">المبلغ (ج.م) *</label>
          <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" min="0.01" required style="font-size: 1.15rem; font-weight: 700; color: var(--gold);">
        </div>

        <div class="form-group">
          <label class="form-label">التصنيف *</label>
          <input type="text" name="category" class="form-control" placeholder="مثال: أداء متميز، تأخير، غياب، سلفة..." required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">السبب والمبرر التفصيلي *</label>
        <textarea name="reason" class="form-control" rows="3" placeholder="اكتب مبرر المكافأة أو مخالفة الخصم بوضوح للمدير..." required></textarea>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 1.05rem;">
        حفظ وإرسال للاعتماد 🚀
      </button>
    </form>
  </div>
</div>
{% endblock %}
